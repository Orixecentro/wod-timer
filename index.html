<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WOD TIMER</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:'Barlow Condensed',sans-serif;background:#080808;color:#f5f5f5;user-select:none;}

:root{
  --work:#ff1a1a; --work-bg:#1a0000;
  --rest:#00e676; --rest-bg:#001a0a;
  --blue:#2979ff; --blue-bg:#00082a;
  --border:#252525; --muted:#555;
}

.screen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;}
.screen.active{display:flex;}

/* ── BUILDER ── */
#screen-builder{flex-direction:column;}
.b-header{display:flex;align-items:center;justify-content:space-between;padding:14px 36px;border-bottom:1px solid var(--border);flex-shrink:0;background:#0e0e0e;}
.b-header h1{font-weight:900;font-size:36px;letter-spacing:8px;color:var(--work);}
.wod-total{font-size:11px;color:var(--muted);text-align:right;font-family:'Barlow',sans-serif;letter-spacing:2px;}
.wod-total span{display:block;font-weight:900;font-size:28px;letter-spacing:4px;color:#f5f5f5;}

.b-body{display:flex;flex:1;overflow:hidden;}

.bl{width:320px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;background:#0a0a0a;padding:8px 0;}
.bl::-webkit-scrollbar{width:3px;}
.bl::-webkit-scrollbar-thumb{background:var(--border);}
.bi{display:flex;align-items:center;padding:12px 16px;border-left:4px solid transparent;gap:10px;cursor:pointer;}
.bi:hover{background:#1c0000;border-left-color:var(--work);}
.bi.sel{background:#130000;border-left-color:var(--work);}
.bi-dot{width:8px;height:8px;border-radius:50%;background:var(--work);flex-shrink:0;}
.bi-dot.g{background:var(--rest);}
.bi-dot.b{background:var(--blue);}
.bi-info{flex:1;min-width:0;}
.bi-name{font-weight:700;font-size:18px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bi-meta{font-size:11px;color:var(--muted);margin-top:2px;font-family:'Barlow',sans-serif;}
.bi-dur{font-weight:700;font-size:16px;color:var(--muted);flex-shrink:0;}

.btn-add{margin:8px 16px;padding:10px;border:1px dashed var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:3px;background:transparent;cursor:pointer;text-align:center;width:calc(100% - 32px);}
.btn-add:hover{border-color:var(--work);color:var(--work);background:#150000;}
.btn-start{border-color:var(--rest);color:var(--rest);}
.btn-start:hover{background:#001508;border-color:var(--rest);color:var(--rest);}

.ep{flex:1;padding:16px 28px;overflow-y:auto;display:flex;flex-direction:column;background:#0c0c0c;}
.ep::-webkit-scrollbar{width:3px;}
.ep::-webkit-scrollbar-thumb{background:var(--border);}
.ep-ttl{font-size:11px;letter-spacing:5px;color:var(--muted);margin-bottom:12px;font-family:'Barlow',sans-serif;}
.fr{display:flex;align-items:center;padding:10px 8px;border-bottom:1px solid var(--border);gap:12px;cursor:pointer;}
.fr:hover{background:#150000;}
.fl{width:200px;font-size:13px;color:var(--muted);flex-shrink:0;font-family:'Barlow',sans-serif;}
.fc{display:flex;align-items:center;gap:8px;flex:1;}
.fv{font-weight:900;font-size:26px;letter-spacing:2px;min-width:90px;text-align:center;}
.fr:hover .fv{color:var(--work);}
.arr{font-size:20px;color:var(--muted);padding:4px 10px;cursor:pointer;line-height:1;}
.arr:hover{color:var(--work);}
.act-row{display:flex;gap:10px;margin-top:18px;}
.ab{padding:10px 22px;font-weight:700;font-size:16px;letter-spacing:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Barlow Condensed',sans-serif;}
.ab:hover{background:var(--rest);color:#000;border-color:var(--rest);}
.ab.del:hover{background:var(--work);border-color:var(--work);color:#fff;}
.empty-ep{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:3px;}

.type-badge{font-size:9px;letter-spacing:2px;padding:2px 5px;border:1px solid;margin-left:5px;vertical-align:middle;font-weight:700;}
.tb-emom{border-color:var(--work);color:var(--work);}
.tb-amrap{border-color:var(--rest);color:var(--rest);}
.tb-fortime{border-color:var(--blue);color:var(--blue);}
.tb-tabata{border-color:#ffaa00;color:#ffaa00;}
.tb-rft{border-color:#cc44ff;color:#cc44ff;}
.tb-ladder{border-color:#ff6600;color:#ff6600;}
.tb-deathby{border-color:#ff0066;color:#ff0066;}

.desc-card{margin-top:14px;padding:12px 14px;border-left:3px solid;background:rgba(0,0,0,.35);}
.desc-title{font-weight:700;font-size:13px;letter-spacing:2px;margin-bottom:5px;}
.desc-text{font-family:'Barlow',sans-serif;font-size:12px;color:#666;line-height:1.5;margin-bottom:5px;}
.desc-ex{font-family:'Barlow',sans-serif;font-size:11px;color:#404040;border-top:1px solid #1e1e1e;padding-top:5px;line-height:1.4;}

.dur-line{margin-top:12px;font-size:11px;color:var(--muted);letter-spacing:2px;font-family:'Barlow',sans-serif;}
.dur-val{font-weight:900;font-size:20px;letter-spacing:3px;color:var(--rest);}

/* ── RUNNER ── */
#screen-runner{flex-direction:column;}
.run-bg-work{background:radial-gradient(ellipse at center,#2a0000 0%,#0e0000 55%,#060000 100%);}
.run-bg-rest{background:radial-gradient(ellipse at center,#002a10 0%,#000e06 55%,#000503 100%);}
.run-bg-blue{background:radial-gradient(ellipse at center,#001040 0%,#00061a 55%,#000308 100%);}

.run-top{display:flex;justify-content:space-between;align-items:center;padding:10px 40px;flex-shrink:0;}
.run-name{font-weight:900;font-size:22px;letter-spacing:4px;text-transform:uppercase;}
.run-dots{display:flex;gap:6px;align-items:center;}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.pdot.done{background:var(--muted);}
.pdot.cur{background:var(--work);transform:scale(1.3);}
.run-si{font-weight:700;font-size:20px;letter-spacing:3px;color:var(--muted);}

.run-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.phase-lbl{font-weight:700;font-size:18px;letter-spacing:10px;color:var(--muted);margin-bottom:4px;}
.phase-lbl.work{color:var(--work);}
.phase-lbl.rest{color:var(--rest);}
.phase-lbl.blue{color:var(--blue);}

.big-t{font-weight:900;line-height:.88;letter-spacing:0;font-size:22vw;display:block;text-align:center;width:100%;}
.big-t.work{color:var(--work);text-shadow:0 0 80px rgba(255,26,26,.3);}
.big-t.rest{color:var(--rest);text-shadow:0 0 80px rgba(0,230,118,.2);}
.big-t.blue{color:var(--blue);text-shadow:0 0 80px rgba(41,121,255,.3);}

.rep-row{display:flex;flex-direction:column;align-items:center;margin-top:6px;}
.rep-lbl{font-size:12px;letter-spacing:6px;color:var(--muted);}
.rep-val{font-weight:900;font-size:7vw;line-height:1;letter-spacing:2px;color:var(--rest);}

.rpips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center;max-width:80vw;}
.rpip{width:13px;height:13px;border-radius:50%;border:2px solid var(--muted);}
.rpip.done{background:var(--rest);border-color:var(--rest);}
.rpip.cur{border-color:var(--work);transform:scale(1.2);}

.pbar{position:absolute;bottom:0;left:0;height:4px;background:var(--work);transition:width 1s linear,background .4s;}
.pbar.rest{background:var(--rest);}
.pbar.blue{background:var(--blue);}

.run-bot{display:flex;justify-content:space-between;align-items:center;padding:10px 40px 12px;border-top:1px solid var(--border);flex-shrink:0;background:rgba(0,0,0,.6);}
.next-box{font-family:'Barlow',sans-serif;}
.next-lbl{font-size:9px;color:var(--muted);letter-spacing:4px;}
.next-val{font-weight:700;font-size:18px;letter-spacing:3px;color:#444;}
.ctrl-btns{display:flex;gap:10px;}
.cbtn{padding:10px 18px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px;background:rgba(0,0,0,.7);border:1px solid #333;color:#aaa;cursor:pointer;}
.cbtn:hover{border-color:#fff;color:#fff;}
.wr-box{text-align:right;font-family:'Barlow',sans-serif;font-size:9px;color:var(--muted);letter-spacing:2px;}
.wr-val{font-weight:700;font-size:18px;letter-spacing:3px;color:#333;}

/* ── FINISHED ── */
#screen-finished{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#002a10 0%,#000a04 60%,#000 100%);}
.fin-t{font-weight:900;font-size:80px;letter-spacing:12px;color:var(--rest);text-shadow:0 0 80px rgba(0,230,118,.4);}
.fin-time{font-weight:900;font-size:60px;letter-spacing:8px;color:#fff;margin-top:6px;}
.fin-sub{font-size:11px;letter-spacing:5px;color:var(--muted);margin-top:8px;font-family:'Barlow',sans-serif;}
.fin-btns{display:flex;gap:14px;margin-top:36px;}
.fbtn{padding:12px 28px;font-weight:700;font-size:18px;letter-spacing:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Barlow Condensed',sans-serif;}
.fbtn:hover{background:var(--rest);color:#000;border-color:var(--rest);}
.fbtn.sec:hover{background:#333;color:#fff;border-color:#555;}

.flash-ov{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:100;transition:opacity .08s;}
.flash-ov.fl{opacity:.2;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulsing{animation:pulse 1s infinite;}
</style>
</head>
<body>

<div class="flash-ov" id="flashOv"></div>

<!-- BUILDER -->
<div id="screen-builder" class="screen active">
  <div class="b-header">
    <h1>WOD TIMER</h1>
    <div class="wod-total">DURACIÓN TOTAL WOD<span id="totalDisp">00:00</span></div>
  </div>
  <div class="b-body">
    <div class="bl" id="blockList"></div>
    <div class="ep" id="editorPanel">
      <div class="empty-ep"><div style="font-size:40px;opacity:.1">+</div><div>SELECCIONA O AÑADE UN BLOQUE</div></div>
    </div>
  </div>
</div>

<!-- RUNNER -->
<div id="screen-runner" class="screen">
  <div class="run-top">
    <div class="run-name" id="rBN">—</div>
    <div class="run-dots" id="rDots"></div>
    <div class="run-si" id="rSI">—</div>
  </div>
  <div class="run-mid">
    <div class="phase-lbl" id="rPL">LISTO</div>
    <div class="big-t work" id="rTimer">00:00</div>
    <div class="rep-row" id="repRow" style="display:none;">
      <div class="rep-lbl">RONDA</div>
      <div class="rep-val" id="repVal">—</div>
    </div>
    <div class="rpips" id="rPips"></div>
    <div class="pbar" id="pBar" style="width:100%"></div>
  </div>
  <div class="run-bot">
    <div class="next-box">
      <div class="next-lbl">SIGUIENTE</div>
      <div class="next-val" id="rNext">—</div>
    </div>
    <div class="ctrl-btns">
      <button class="cbtn" id="btnRestart">⏮</button>
      <button class="cbtn" id="btnPause">⏸ PAUSA</button>
      <button class="cbtn" id="btnSkip">⏭</button>
      <button class="cbtn" id="btnExit" style="color:#555;border-color:#333;">✕ SALIR</button>
    </div>
    <div class="wr-box">WOD RESTANTE<div class="wr-val" id="rWR">00:00</div></div>
  </div>
</div>

<!-- FINISHED -->
<div id="screen-finished" class="screen">
  <div class="fin-t">WOD COMPLETO</div>
  <div class="fin-time" id="finTime">00:00</div>
  <div class="fin-sub">TIEMPO TOTAL</div>
  <div class="fin-btns">
    <button class="fbtn" id="finRepeat">REPETIR WOD</button>
    <button class="fbtn sec" id="finEdit">EDITAR</button>
  </div>
</div>

<script>
// ═══ DATA ═══
let blocks=[
  {id:1,type:'emom',name:'EMOM A',reps:5,workSec:150,restRepSec:10,restBlockSec:60,timecap:0,rounds:5,totalSec:600,tabataWork:20,tabataRest:10,tabataSets:8,startReps:1,endReps:10,stepReps:1,workPerRep:10,direction:'up'},
  {id:2,type:'emom',name:'EMOM B',reps:5,workSec:180,restRepSec:10,restBlockSec:0,timecap:0,rounds:5,totalSec:600,tabataWork:20,tabataRest:10,tabataSets:8,startReps:1,endReps:10,stepReps:1,workPerRep:10,direction:'up'},
];
let nextId=3;

function def(idx){return{id:nextId++,type:'emom',name:'BLOQUE '+(idx+1),reps:5,workSec:150,restRepSec:10,restBlockSec:60,timecap:0,rounds:5,totalSec:600,tabataWork:20,tabataRest:10,tabataSets:8,startReps:1,endReps:10,stepReps:1,workPerRep:10,direction:'up'};}
function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function ladderArr(b){const a=[];if(b.direction==='up'){for(let r=b.startReps;r<=b.endReps;r+=b.stepReps)a.push(r);}else{for(let r=b.startReps;r>=b.endReps;r-=b.stepReps)a.push(r);}return a.length?a:[b.startReps];}

function blockDur(b){
  switch(b.type){
    case'emom':return b.reps*b.workSec+Math.max(0,b.reps-1)*b.restRepSec+b.restBlockSec;
    case'amrap':return b.totalSec+b.restBlockSec;
    case'fortime':return(b.timecap||1200)+b.restBlockSec;
    case'tabata':return b.tabataSets*(b.tabataWork+b.tabataRest)+b.restBlockSec;
    case'rft':return b.rounds*(b.workSec+b.restRepSec)+b.restBlockSec;
    case'ladder':{const r=ladderArr(b);return r.reduce((s,x)=>s+x*b.workPerRep+b.restRepSec,0)+b.restBlockSec;}
    case'deathby':return b.totalSec+b.restBlockSec;
    default:return 0;
  }
}
function totalWod(){return blocks.reduce((s,b)=>s+blockDur(b),0);}

function typeLabel(t){return{emom:'EMOM',amrap:'AMRAP',fortime:'FOR TIME',tabata:'TABATA',rft:'RFT',ladder:'LADDER',deathby:'DEATH BY'}[t]||t.toUpperCase();}
function typeBadge(t){return{emom:'tb-emom',amrap:'tb-amrap',fortime:'tb-fortime',tabata:'tb-tabata',rft:'tb-rft',ladder:'tb-ladder',deathby:'tb-deathby'}[t]||'';}
function dotCls(t){return(t==='amrap'||t==='fortime')?'g':(t==='deathby'||t==='ladder')?'b':'';}

function blockMeta(b){
  switch(b.type){
    case'emom':return b.reps+' REPS · '+fmt(b.workSec)+' · DESC '+fmt(b.restRepSec);
    case'amrap':return fmt(b.totalSec)+' TOTAL';
    case'fortime':return'TIME CAP: '+(b.timecap?fmt(b.timecap):'LIBRE');
    case'tabata':return b.tabataSets+'×'+b.tabataWork+'s/'+b.tabataRest+'s';
    case'rft':return b.rounds+' RONDAS · '+fmt(b.workSec)+'/ronda';
    case'ladder':return(b.direction==='up'?'↑':'↓')+' '+b.startReps+'→'+b.endReps+' (±'+b.stepReps+')';
    case'deathby':return'DEATH BY · inicio '+b.startReps+' rep';
    default:return'';
  }
}

function getFields(b){
  const all=[
    {key:'name',label:'NOMBRE',type:'text'},
    {key:'type',label:'TIPO DE WOD',type:'select',options:['emom','amrap','fortime','tabata','rft','ladder','deathby']},
  ];
  switch(b.type){
    case'emom':all.push(
      {key:'reps',label:'Nº RONDAS',type:'number',step:1,min:1,max:60},
      {key:'workSec',label:'TIEMPO TRABAJO',type:'time',step:5,min:5,max:3600},
      {key:'restRepSec',label:'DESCANSO ENTRE REPS',type:'time',step:5,min:0,max:600},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
    case'amrap':all.push(
      {key:'totalSec',label:'DURACIÓN',type:'time',step:30,min:30,max:7200},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
    case'fortime':all.push(
      {key:'timecap',label:'TIME CAP (0=libre)',type:'time',step:30,min:0,max:7200},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
    case'tabata':all.push(
      {key:'tabataSets',label:'Nº SERIES',type:'number',step:1,min:1,max:30},
      {key:'tabataWork',label:'TIEMPO TRABAJO',type:'time',step:5,min:5,max:120},
      {key:'tabataRest',label:'TIEMPO DESCANSO',type:'time',step:5,min:5,max:120},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
    case'rft':all.push(
      {key:'rounds',label:'Nº RONDAS',type:'number',step:1,min:1,max:30},
      {key:'workSec',label:'TIEMPO POR RONDA',type:'time',step:5,min:5,max:3600},
      {key:'restRepSec',label:'DESCANSO ENTRE RONDAS',type:'time',step:5,min:0,max:600},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
    case'ladder':all.push(
      {key:'direction',label:'DIRECCIÓN',type:'select',options:['up','down']},
      {key:'startReps',label:'REPS INICIO',type:'number',step:1,min:1,max:50},
      {key:'endReps',label:'REPS FIN',type:'number',step:1,min:1,max:50},
      {key:'stepReps',label:'INCREMENTO',type:'number',step:1,min:1,max:10},
      {key:'workPerRep',label:'SEG POR REP',type:'number',step:1,min:1,max:30},
      {key:'restRepSec',label:'DESCANSO ENTRE RONDAS',type:'time',step:5,min:0,max:600},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
    case'deathby':all.push(
      {key:'startReps',label:'REPS INICIALES',type:'number',step:1,min:1,max:10},
      {key:'totalSec',label:'DURACIÓN ESTIMADA',type:'time',step:60,min:60,max:1800},
      {key:'restBlockSec',label:'DESCANSO TRAS BLOQUE',type:'time',step:5,min:0,max:600});break;
  }
  return all;
}

const DESCS={
  emom:{c:'#ff1a1a',t:'EMOM — Every Minute On the Minute',d:'Cada minuto realizas el trabajo. Lo que sobre es descanso. Si tardas más de un minuto, has fallado la rep.',e:'5 EMOM 2:30 → cada 2:30 haces la tarea; el resto descansas.'},
  amrap:{c:'#00e676',t:'AMRAP — As Many Rounds As Possible',d:'Tiempo fijo, máximas rondas posibles. Sin descanso programado.',e:'AMRAP 20 min → repites el circuito hasta que suene el tiempo.'},
  fortime:{c:'#2979ff',t:'FOR TIME — AFAP',d:'Completa el trabajo fijo lo más rápido posible. El crono cuenta hacia arriba. Pulsa PAUSA al terminar.',e:'21-15-9 thrusters → para el crono al acabar la última rep.'},
  tabata:{c:'#ffaa00',t:'TABATA',d:'Trabajo corto / descanso corto repetido. Estándar: 20s/10s × 8 series.',e:'8×20s trabajo / 10s descanso = 4 minutos.'},
  rft:{c:'#cc44ff',t:'RFT — Rounds For Time',d:'X rondas en el menor tiempo posible. Descanso opcional entre rondas.',e:'5 RFT → 5 veces el circuito, para el crono al acabar.'},
  ladder:{c:'#ff6600',t:'LADDER — Escalera',d:'Reps que suben o bajan cada ronda según el incremento configurado.',e:'Ascendente 2→10 paso 2: rondas de 2,4,6,8,10 reps.'},
  deathby:{c:'#ff0066',t:'DEATH BY',d:'Cada minuto añades una rep. Continúa hasta que no puedas completar las reps en el minuto.',e:'Death By 1: min1→1rep, min2→2reps, min3→3reps...'},
};

// ═══ NAV ═══
let nav={selectedId:null};

// ═══ AUDIO ═══
let _audioCtx=null;
function _getCtx(){
  if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return _audioCtx;
}
function beep(freq,dur,vol){
  try{
    const ctx=_getCtx();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.6,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(dur||0.15));
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime+(dur||0.15));
  }catch(e){}
}
// Desbloquear AudioContext en el primer gesto del usuario
document.addEventListener('click',()=>{try{_getCtx();}catch(e){}},{once:true});
document.addEventListener('keydown',()=>{try{_getCtx();}catch(e){}},{once:true});

// ═══ RENDER ═══
function renderBuilder(){
  document.getElementById('totalDisp').textContent=fmt(totalWod());
  renderList();
  renderEditor();
}

function renderList(){
  const el=document.getElementById('blockList');
  el.innerHTML='';
  blocks.forEach(b=>{
    const d=document.createElement('div');
    d.className='bi'+(nav.selectedId===b.id?' sel':'');
    d.innerHTML='<div class="bi-dot '+dotCls(b.type)+'"></div>'
      +'<div class="bi-info"><div class="bi-name">'+b.name+'<span class="type-badge '+typeBadge(b.type)+'">'+typeLabel(b.type)+'</span></div>'
      +'<div class="bi-meta">'+blockMeta(b)+'</div></div>'
      +'<div class="bi-dur">'+fmt(blockDur(b))+'</div>';
    d.onclick=()=>{nav.selectedId=b.id;renderBuilder();};
    el.appendChild(d);
  });
  const add=document.createElement('button');
  add.className='btn-add';add.textContent='+ AÑADIR BLOQUE';
  add.onclick=()=>{const nb=def(blocks.length);blocks.push(nb);nav.selectedId=nb.id;renderBuilder();};
  el.appendChild(add);
  if(blocks.length>0){
    const st=document.createElement('button');
    st.className='btn-add btn-start';st.textContent='▶ INICIAR WOD';
    st.onclick=()=>startRunner();
    el.appendChild(st);
  }
}

function renderEditor(){
  const panel=document.getElementById('editorPanel');
  if(!nav.selectedId){
    panel.innerHTML='<div class="empty-ep"><div style="font-size:40px;opacity:.1">+</div><div>SELECCIONA O AÑADE UN BLOQUE</div></div>';
    return;
  }
  const b=blocks.find(x=>x.id===nav.selectedId);
  if(!b){panel.innerHTML='<div class="empty-ep"><div>BLOQUE NO ENCONTRADO</div></div>';return;}
  const fields=getFields(b);
  panel.innerHTML='<div class="ep-ttl">CONFIGURAR BLOQUE</div>';

  fields.forEach((f,i)=>{
    const row=document.createElement('div');
    row.className='fr';
    let val=f.type==='time'?fmt(b[f.key]):f.type==='select'?(f.key==='direction'?(b[f.key]==='up'?'ASCENDENTE':'DESCENDENTE'):b[f.key].toUpperCase()):b[f.key];
    if(f.type!=='text'){
      row.innerHTML='<div class="fl">'+f.label+'</div><div class="fc">'
        +'<span class="arr" data-i="'+i+'" data-d="-1">◀</span>'
        +'<span class="fv">'+val+'</span>'
        +'<span class="arr" data-i="'+i+'" data-d="1">▶</span>'
        +'</div>';
      row.querySelectorAll('.arr').forEach(a=>{
        a.onclick=e=>{
          e.stopPropagation();
          const dir=parseInt(a.dataset.d);
          if(f.type==='number')b[f.key]=clamp(b[f.key]+dir*f.step,f.min,f.max);
          else if(f.type==='time')b[f.key]=clamp(b[f.key]+dir*f.step,f.min,f.max);
          else if(f.type==='select'){const o=f.options;b[f.key]=o[(o.indexOf(b[f.key])+dir+o.length)%o.length];}
          renderBuilder();
        };
      });
    } else {
      row.innerHTML='<div class="fl">'+f.label+'</div><div class="fc"><span class="fv">'+val+'</span></div>';
    }
    panel.appendChild(row);
  });

  const dur=document.createElement('div');
  dur.className='dur-line';
  dur.innerHTML='DURACIÓN BLOQUE: <span class="dur-val">'+fmt(blockDur(b))+'</span>';
  panel.appendChild(dur);

  const desc=DESCS[b.type];
  if(desc){
    const card=document.createElement('div');
    card.className='desc-card';
    card.style.borderColor=desc.c;
    card.innerHTML='<div class="desc-title" style="color:'+desc.c+'">'+desc.t+'</div>'
      +'<div class="desc-text">'+desc.d+'</div>'
      +'<div class="desc-ex"><span style="color:'+desc.c+';font-size:10px;letter-spacing:1px;">EJEMPLO · </span>'+desc.e+'</div>';
    panel.appendChild(card);
  }

  const actRow=document.createElement('div');
  actRow.className='act-row';
  const dupBtn=document.createElement('button');dupBtn.className='ab';dupBtn.textContent='DUPLICAR';
  dupBtn.onclick=()=>{const nb={...b,id:nextId++,name:b.name+' COPIA'};const i=blocks.findIndex(x=>x.id===b.id);blocks.splice(i+1,0,nb);nav.selectedId=nb.id;renderBuilder();};
  const delBtn=document.createElement('button');delBtn.className='ab del';delBtn.textContent='ELIMINAR';
  delBtn.onclick=()=>{const i=blocks.findIndex(x=>x.id===b.id);blocks=blocks.filter(x=>x.id!==b.id);nav.selectedId=blocks.length>0?blocks[Math.min(i,blocks.length-1)].id:null;renderBuilder();};
  actRow.appendChild(dupBtn);actRow.appendChild(delBtn);
  panel.appendChild(actRow);
}

// ═══ RUNNER ═══
let R={bi:0,phase:'work',rep:0,tl:0,pd:0,paused:false,iv:null,elapsed:0,dbMin:0,lrIdx:0,lrArr:[]};

function startRunner(){
  if(!blocks.length)return;
  showScreen('runner');
  R.elapsed=0;R.paused=false;
  if(R.iv)clearInterval(R.iv);
  document.getElementById('btnRestart').onclick=()=>{clearInterval(R.iv);startBlock(R.bi);};
  document.getElementById('btnPause').onclick=()=>{
    const b=blocks[R.bi];
    if(b.type==='fortime'&&R.phase==='work'){clearInterval(R.iv);b.restBlockSec>0?startPhase('rest-block'):startBlock(R.bi+1);return;}
    R.paused=!R.paused;
    document.getElementById('rTimer').classList.toggle('pulsing',R.paused);
    document.getElementById('btnPause').textContent=R.paused?'▶ REANUDAR':'⏸ PAUSA';
  };
  document.getElementById('btnSkip').onclick=()=>{clearInterval(R.iv);nextPhase();};
  document.getElementById('btnExit').onclick=()=>{clearInterval(R.iv);showScreen('builder');renderBuilder();};
  startBlock(0);
}

function startBlock(idx){
  if(idx>=blocks.length){finishWod();return;}
  R.bi=idx;R.rep=0;R.dbMin=0;R.lrIdx=0;
  const b=blocks[idx];
  if(b.type==='ladder')R.lrArr=ladderArr(b);
  startPhase('work');
}

function startPhase(phase){
  R.phase=phase;
  const b=blocks[R.bi];let dur=0;
  if(phase==='work'){
    switch(b.type){
      case'emom':dur=b.workSec;break;case'amrap':dur=b.totalSec;break;
      case'fortime':dur=0;break;case'tabata':dur=b.tabataWork;break;
      case'rft':dur=b.workSec;break;
      case'ladder':dur=R.lrArr[R.lrIdx]*b.workPerRep;break;
      case'deathby':dur=60;break;
    }
  }else if(phase==='rest-rep'){
    switch(b.type){
      case'emom':dur=b.restRepSec;break;case'tabata':dur=b.tabataRest;break;
      case'rft':dur=b.restRepSec;break;case'ladder':dur=b.restRepSec;break;
    }
  }else if(phase==='rest-block'){dur=b.restBlockSec||0;}
  R.tl=dur;R.pd=dur;
  document.getElementById('btnPause').textContent='⏸ PAUSA';
  updateUI();
  if(R.iv)clearInterval(R.iv);
  if(b.type==='fortime'&&phase==='work')R.iv=setInterval(tickUp,1000);
  else R.iv=setInterval(tick,1000);
}

function tick(){
  if(R.paused)return;
  R.tl--;R.elapsed++;updateUI();
  if(R.tl<=3&&R.tl>0)triggerFlash();
  if(R.tl<=0){
    beep(880,0.18,0.7); // ← beep al finalizar fase
    clearInterval(R.iv);
    nextPhase();
  }
}
function tickUp(){if(R.paused)return;R.tl++;R.elapsed++;updateUI();}

function nextPhase(){
  const b=blocks[R.bi];
  if(R.phase==='work'){
    R.rep++;
    switch(b.type){
      case'emom':R.rep<b.reps?(b.restRepSec>0?startPhase('rest-rep'):startPhase('work')):(b.restBlockSec>0?startPhase('rest-block'):startBlock(R.bi+1));break;
      case'amrap':b.restBlockSec>0?startPhase('rest-block'):startBlock(R.bi+1);break;
      case'tabata':R.rep<b.tabataSets?startPhase('rest-rep'):(b.restBlockSec>0?startPhase('rest-block'):startBlock(R.bi+1));break;
      case'rft':R.rep<b.rounds?(b.restRepSec>0?startPhase('rest-rep'):startPhase('work')):(b.restBlockSec>0?startPhase('rest-block'):startBlock(R.bi+1));break;
      case'ladder':R.lrIdx++;R.lrIdx<R.lrArr.length?(b.restRepSec>0?startPhase('rest-rep'):startPhase('work')):(b.restBlockSec>0?startPhase('rest-block'):startBlock(R.bi+1));break;
      case'deathby':R.dbMin++;startPhase('work');break;
    }
  }else if(R.phase==='rest-rep')startPhase('work');
  else if(R.phase==='rest-block')startBlock(R.bi+1);
}

function updateUI(){
  const b=blocks[R.bi],ph=R.phase;
  const scr=document.getElementById('screen-runner');
  scr.className='screen active '+(ph==='work'?'run-bg-work':ph==='rest-rep'?'run-bg-rest':'run-bg-blue');
  const pl=document.getElementById('rPL');
  pl.textContent={work:'TRABAJO','rest-rep':'DESCANSO','rest-block':'DESCANSO SERIE'}[ph]||'';
  pl.className='phase-lbl '+(ph==='work'?'work':ph==='rest-rep'?'rest':'blue');
  const te=document.getElementById('rTimer');
  te.textContent=fmt(R.tl);
  te.className='big-t '+(ph==='work'?'work':ph==='rest-rep'?'rest':'blue');
  document.getElementById('rBN').textContent=b.name;
  const dots=document.getElementById('rDots');dots.innerHTML='';
  blocks.forEach((_,i)=>{const d=document.createElement('div');d.className='pdot'+(i<R.bi?' done':i===R.bi?' cur':'');dots.appendChild(d);});
  let si='—';
  if(b.type==='emom')si=(R.rep+1)+'/'+b.reps;
  else if(b.type==='tabata')si=(R.rep+1)+'/'+b.tabataSets;
  else if(b.type==='rft')si=(R.rep+1)+'/'+b.rounds;
  else if(b.type==='ladder')si=(R.lrIdx+1)+'/'+R.lrArr.length;
  else if(b.type==='deathby')si='MIN '+(R.dbMin+1);
  else if(b.type==='amrap')si='AMRAP';
  else if(b.type==='fortime')si='FOR TIME';
  document.getElementById('rSI').textContent=si;
  const rr=document.getElementById('repRow');
  let showRep=false,repTxt='';
  if(ph==='work'){
    if(b.type==='emom'||b.type==='rft'||b.type==='tabata'){showRep=true;repTxt=(R.rep+1)+' / '+(b.type==='emom'?b.reps:b.type==='rft'?b.rounds:b.tabataSets);}
    else if(b.type==='ladder'){showRep=true;repTxt=R.lrArr[R.lrIdx]+' REPS';}
    else if(b.type==='deathby'){showRep=true;repTxt=(b.startReps+R.dbMin)+' REPS';}
  }
  rr.style.display=showRep?'flex':'none';
  if(showRep)document.getElementById('repVal').textContent=repTxt;
  const pips=document.getElementById('rPips');pips.innerHTML='';
  let tot=0,don=0;
  if(b.type==='emom'){tot=b.reps;don=R.rep;}
  else if(b.type==='tabata'){tot=b.tabataSets;don=R.rep;}
  else if(b.type==='rft'){tot=b.rounds;don=R.rep;}
  else if(b.type==='ladder'){tot=R.lrArr.length;don=R.lrIdx;}
  if(tot>0&&tot<=20){for(let i=0;i<tot;i++){const p=document.createElement('div');p.className='rpip'+(i<don?' done':i===don?' cur':'');pips.appendChild(p);}}
  const bar=document.getElementById('pBar');
  const isUp=b.type==='fortime'&&ph==='work';
  bar.style.width=(R.pd>0&&!isUp)?(R.tl/R.pd*100)+'%':'100%';
  bar.className='pbar'+(ph==='rest-rep'?' rest':ph==='rest-block'?' blue':'');
  document.getElementById('rWR').textContent=fmt(calcRem());
  document.getElementById('rNext').textContent=getNext();
}

function calcRem(){
  let t=0;const b=blocks[R.bi];
  if(R.phase==='rest-block')t+=R.tl;
  else if(b.type!=='fortime'){
    t+=R.tl;
    const rl=b.type==='emom'?b.reps-R.rep-1:b.type==='rft'?b.rounds-R.rep-1:0;
    t+=R.phase==='rest-rep'?rl*(b.workSec+b.restRepSec)+b.workSec:rl*(b.workSec+b.restRepSec);
    t+=b.restBlockSec||0;
  }
  for(let i=R.bi+1;i<blocks.length;i++)t+=blockDur(blocks[i]);
  return t;
}
function getNext(){
  const b=blocks[R.bi];
  if(R.phase==='work'){if(b.type==='amrap'||b.type==='fortime')return b.restBlockSec>0?'DESC '+fmt(b.restBlockSec):(R.bi+1<blocks.length?blocks[R.bi+1].name:'FIN');return'DESCANSO';}
  if(R.phase==='rest-rep')return'TRABAJO';
  if(R.phase==='rest-block')return R.bi+1<blocks.length?blocks[R.bi+1].name:'FIN';
  return'—';
}
function finishWod(){
  clearInterval(R.iv);
  beep(660,0.4,0.8); // ← beep final WOD
  showScreen('finished');
  document.getElementById('finTime').textContent=fmt(R.elapsed);
}

// ═══ FLASH ═══
function triggerFlash(){const f=document.getElementById('flashOv');f.style.background=R.phase==='work'?'#ff1a1a':R.phase==='rest-rep'?'#00e676':'#2979ff';f.classList.add('fl');setTimeout(()=>f.classList.remove('fl'),120);}

// ═══ SCREENS ═══
let curScreen='builder';
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  curScreen=id;
}

// ═══ KEYBOARD ═══
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(curScreen==='runner'){
    if(e.key==='Enter'||e.key===' ')document.getElementById('btnPause').click();
    else if(e.key==='ArrowRight'){clearInterval(R.iv);nextPhase();}
    else if(e.key==='ArrowLeft'){clearInterval(R.iv);startBlock(R.bi);}
    else if(e.key==='Backspace'||e.key==='Escape'||e.keyCode===8){clearInterval(R.iv);showScreen('builder');renderBuilder();}
  }else if(curScreen==='finished'){
    if(e.key==='Enter'||e.key===' ')startRunner();
    else if(e.key==='Backspace'||e.key==='Escape'||e.keyCode===8){showScreen('builder');renderBuilder();}
  }
});
document.addEventListener('keydown',e=>{
  if(e.keyCode===179||e.keyCode===415){
    if(curScreen==='builder')startRunner();
    else if(curScreen==='runner')document.getElementById('btnPause').click();
  }
});

document.getElementById('finRepeat').onclick=startRunner;
document.getElementById('finEdit').onclick=()=>{showScreen('builder');renderBuilder();};

showScreen('builder');
renderBuilder();
</script>
